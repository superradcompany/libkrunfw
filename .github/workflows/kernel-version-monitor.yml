name: Kernel version monitor

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: kernel-version-monitor
  cancel-in-progress: false

jobs:
  check:
    name: Update stable kernel pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Code checkout
        uses: actions/checkout@v7
        with:
          # Manual runs must also prepare the update against the default branch.
          ref: ${{ github.event.repository.default_branch }}

      - name: Prepare kernel update
        id: kernel
        run: scripts/check-kernel-version.sh --update >> "$GITHUB_OUTPUT"

      # Run even without an update so an obsolete PR is closed after a manual bump.
      - name: Open or update kernel pull request
        id: pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: appcypher/kernel-stable-update
          base: ${{ github.event.repository.default_branch }}
          add-paths: Makefile
          sign-commits: true
          delete-branch: true
          commit-message: "fix(kernel): update Linux to ${{ steps.kernel.outputs.latest }}"
          title: "fix(kernel): update Linux to ${{ steps.kernel.outputs.latest }}"
          body: |
            Update the pinned Linux kernel from ${{ steps.kernel.outputs.current }} to ${{ steps.kernel.outputs.latest }} within the same stable series.

            Kernel CI is dispatched for this PR revision to apply the common and TEE patches and build Linux x86_64, Windows x86_64, SEV x86_64, TDX x86_64, Linux aarch64, and Linux riscv64.

            Review the build results and merge manually. This automation does not enable auto-merge. The daily monitor maintains this branch; prepare any patch repairs on a separate branch.

      - name: Verify signed update commits
        if: steps.kernel.outputs.current != steps.kernel.outputs.latest && steps.pull-request.outputs.pull-request-number
        env:
          COMMITS_VERIFIED: ${{ steps.pull-request.outputs.pull-request-commits-verified }}
        run: |
          if [[ $COMMITS_VERIFIED != true ]]; then
            echo "Kernel update commits must have verified signatures" >&2
            exit 1
          fi

      - name: Run all kernel builds for the update
        if: steps.kernel.outputs.current != steps.kernel.outputs.latest && steps.pull-request.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: ${{ steps.pull-request.outputs.pull-request-branch }}
          UPDATE_HEAD_SHA: ${{ steps.pull-request.outputs.pull-request-head-sha }}
        run: bash scripts/dispatch-kernel-ci.sh "$UPDATE_BRANCH" "$UPDATE_HEAD_SHA"
